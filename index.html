<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kuis Pro - Multiplayer</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#075e54">
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { wa_teal: '#075e54', quiz_blue: '#2563eb' } } }
        }
    </script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        ::-webkit-scrollbar { display: none; }
        .hero-bg { background: linear-gradient(135deg, #075e54 0%, #128C7E 100%); }
        .dark .hero-bg { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); }
        .floating { animation: float 3s ease-in-out infinite; }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0px); } }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-200 h-screen flex flex-col transition-colors duration-300">

    <header class="p-4 flex justify-end absolute w-full z-10">
        <button onclick="cycleTheme()" class="w-10 h-10 bg-white/20 backdrop-blur-md rounded-full text-white flex items-center justify-center shadow-lg hover:bg-white/30 transition">
            <i id="themeIcon" class="fa-solid fa-mobile-screen"></i>
        </button>
    </header>

    <section class="hero-bg h-[45%] rounded-b-[3rem] shadow-2xl flex flex-col items-center justify-center text-white relative shrink-0">
        <div class="absolute inset-0 bg-black/10 rounded-b-[3rem]"></div> <div class="z-10 text-center px-4">
            <div class="w-20 h-20 bg-white dark:bg-gray-800 rounded-3xl shadow-lg flex items-center justify-center mx-auto mb-4 floating transform rotate-3">
                <i class="fa-solid fa-bolt text-4xl text-yellow-500"></i>
            </div>
            <h1 class="text-4xl font-black tracking-tight mb-1">Kuis Pro</h1>
            <p class="text-sm opacity-90 font-medium">Platform Kuis Real-time Interaktif</p>
        </div>
    </section>

    <main class="flex-1 flex flex-col items-center justify-center p-6 space-y-6 mt-[-2rem] z-10 relative">
        
        <a href="sd.html" class="w-full max-w-sm bg-white dark:bg-gray-800 p-6 rounded-3xl shadow-xl flex items-center gap-5 border-b-4 border-quiz_blue transform transition active:scale-95 group">
            <div class="w-16 h-16 bg-blue-100 dark:bg-blue-900/30 rounded-2xl flex items-center justify-center text-quiz_blue dark:text-blue-400 text-3xl group-hover:scale-110 transition-transform">
                <i class="fa-solid fa-gamepad"></i>
            </div>
            <div>
                <h2 class="text-2xl font-black text-gray-800 dark:text-white leading-none mb-1">Siswa</h2>
                <p class="text-xs text-gray-500 dark:text-gray-400 font-medium">Gabung kuis pakai PIN</p>
            </div>
            <i class="fa-solid fa-chevron-right ml-auto text-gray-300 dark:text-gray-600"></i>
        </a>

        <a href="tc.html" class="w-full max-w-sm bg-white dark:bg-gray-800 p-6 rounded-3xl shadow-xl flex items-center gap-5 border-b-4 border-green-500 transform transition active:scale-95 group">
            <div class="w-16 h-16 bg-green-100 dark:bg-green-900/30 rounded-2xl flex items-center justify-center text-green-600 dark:text-green-400 text-3xl group-hover:scale-110 transition-transform">
                <i class="fa-solid fa-chalkboard-user"></i>
            </div>
            <div>
                <h2 class="text-2xl font-black text-gray-800 dark:text-white leading-none mb-1">Guru</h2>
                <p class="text-xs text-gray-500 dark:text-gray-400 font-medium">Host kuis & pantau nilai</p>
            </div>
            <i class="fa-solid fa-chevron-right ml-auto text-gray-300 dark:text-gray-600"></i>
        </a>

    </main>

    <footer class="p-6 text-center text-gray-400 dark:text-gray-600 text-xs font-medium pb-8 flex flex-col items-center gap-2">
        <p>V 1.0 &copy; 2026 Kuis Pro Multiplayer</p>
        <a href="su.html" class="inline-flex items-center gap-1 hover:text-gray-600 dark:hover:text-gray-400 transition" title="Akses Admin">
            <i class="fa-solid fa-shield-halved"></i> SU Panel
        </a>
    </footer>

    <script>
        // --- 1. SIKLUS TEMA (Sama dengan halaman lain agar konsisten) ---
        const themeStates = ['system', 'light', 'dark'];
        const themeIcons = ['fa-mobile-screen', 'fa-sun', 'fa-moon'];
        let currentThemeIndex = parseInt(localStorage.getItem('themeIndex')) || 0;

        function applyTheme(index) {
            const theme = themeStates[index];
            document.getElementById('themeIcon').className = `fa-solid ${themeIcons[index]}`;
            const htmlClass = document.documentElement.classList;
            if (theme === 'dark') htmlClass.add('dark');
            else if (theme === 'light') htmlClass.remove('dark');
            else { window.matchMedia('(prefers-color-scheme: dark)').matches ? htmlClass.add('dark') : htmlClass.remove('dark'); }
            localStorage.setItem('themeIndex', index);
        }
        function cycleTheme() { currentThemeIndex = (currentThemeIndex + 1) % themeStates.length; applyTheme(currentThemeIndex); }
        applyTheme(currentThemeIndex);

        // --- 2. REGISTRASI SERVICE WORKER (Syarat Utama PWA) ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(registration => {
                        console.log('PWA Ready! ServiceWorker terdaftar dengan scope: ', registration.scope);
                    })
                    .catch(error => {
                        console.error('ServiceWorker gagal didaftarkan: ', error);
                    });
            });
        }
    </script>
</body>
</html>
