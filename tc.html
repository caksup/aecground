<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Panel Guru - Kuis Pro</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class', theme: { extend: { colors: { wa_teal: '#075e54', wa_light: '#dcf8c6' } } } }</script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>
    
    <style>
        /*
        =========================================================
        RIWAYAT PERUBAHAN VERSI CSS
        - v2.0.0 (8 Jul 2026) : Hide scrollbar, flex animation for section toggle.
        - v3.0.0 (8 Jul 2026) : Standarisasi blok komentar.
        =========================================================
        */
        ::-webkit-scrollbar { display: none; }
        .tab-content, #appSection { display: none; animation: fadeIn 0.2s ease-in-out; }
        .tab-active, .show-section { display: flex; flex-direction: column; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-200 h-screen flex flex-col overflow-hidden transition-colors duration-300">

    <header class="bg-indigo-600 dark:bg-gray-800 text-white p-4 shadow-md flex justify-between items-center z-10 shrink-0">
        <div class="font-bold text-lg flex items-center gap-2"><i class="fa-solid fa-chalkboard-user"></i> Guru Panel</div>
        <div class="flex space-x-6 text-xl items-center">
            <button onclick="cycleTheme()" class="hover:text-yellow-300 transition"><i id="themeIcon" class="fa-solid fa-mobile-screen"></i></button>
            <button onclick="toggleFullScreen()" class="hover:text-blue-300 transition"><i id="fsIcon" class="fa-solid fa-expand"></i></button>
        </div>
    </header>

    <section id="loginSection" class="flex-1 flex items-center justify-center p-4 show-section">
        <div class="bg-white dark:bg-gray-800 p-8 rounded-2xl shadow-lg w-full max-w-sm text-center border-t-4 border-indigo-500">
            <div class="w-20 h-20 bg-indigo-100 dark:bg-indigo-900 rounded-full flex items-center justify-center mx-auto mb-4 text-indigo-600 dark:text-indigo-400"><i class="fa-solid fa-lock text-3xl"></i></div>
            <h2 class="text-2xl font-black mb-2 dark:text-white">Login Guru</h2>
            <p class="text-sm text-gray-500 dark:text-gray-400 mb-6">Masukkan PIN 4 digit dari admin</p>
            
            <form id="loginForm" class="space-y-4">
                <input type="password" id="pinInput" maxlength="4" pattern="\d{4}" required placeholder="* * * *" class="w-full text-center text-3xl tracking-[1em] p-4 bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 font-mono dark:text-white">
                <button type="submit" id="btnLogin" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl shadow-md transition-colors flex justify-center items-center gap-2">
                    Masuk <i class="fa-solid fa-arrow-right-to-bracket"></i>
                </button>
                <p id="loginError" class="text-red-500 text-xs font-bold hidden"></p>
            </form>
        </div>
    </section>

    <section id="appSection" class="flex-1 overflow-hidden relative">
        <main class="flex-1 overflow-y-auto p-4 pb-24 space-y-4 h-full">
            <div id="tab-info" class="tab-content tab-active h-full space-y-4">
                <div class="bg-indigo-50 dark:bg-gray-800 border border-indigo-100 dark:border-gray-700 p-4 rounded-xl shadow-sm text-center">
                    <p class="text-xs text-indigo-500 dark:text-indigo-400 font-bold uppercase mb-1">Status Anda</p>
                    <h3 class="text-xl font-black text-gray-800 dark:text-white" id="displayTeacherName">Memuat...</h3>
                </div>
                <div class="bg-white dark:bg-gray-800 p-5 rounded-xl shadow-sm border-l-4 border-green-500">
                    <div class="flex gap-3 items-center mb-2"><i class="fa-solid fa-play text-green-500 text-xl"></i><h3 class="font-bold text-gray-800 dark:text-white">Mulai Sesi Kuis</h3></div>
                    <p class="text-xs text-gray-500 dark:text-gray-400 mb-4">Buat ruangan baru agar siswa bisa bergabung.</p>
                    <button onclick="buatRuangan()" class="w-full bg-green-500 hover:bg-green-600 text-white py-3 rounded-xl font-bold shadow active:scale-95 transition-transform">Generate PIN Ruangan</button>
                </div>
            </div>
            <div id="tab-profil" class="tab-content h-full">
                <div class="bg-white dark:bg-gray-800 p-5 rounded-xl shadow-sm text-center">
                    <button onclick="logout()" class="w-full bg-red-100 dark:bg-red-900/30 text-red-600 py-3 rounded-xl font-bold flex justify-center items-center gap-2"><i class="fa-solid fa-power-off"></i> Keluar (Logout)</button>
                </div>
            </div>
        </main>
        <nav class="bg-white dark:bg-gray-800 border-t dark:border-gray-700 flex justify-between px-2 py-2 fixed bottom-0 w-full z-20 shrink-0 shadow-[0_-2px_10px_rgba(0,0,0,0.05)]">
            <button onclick="switchTab('tab-info', this)" class="nav-btn text-indigo-600 flex flex-col items-center w-1/4 py-1"><i class="fa-solid fa-tower-broadcast text-xl mb-1"></i><span class="text-[10px] font-bold">Info</span></button>
            <button onclick="switchTab('tab-profil', this)" class="nav-btn text-gray-400 dark:text-gray-500 flex flex-col items-center w-1/4 py-1"><i class="fa-solid fa-id-badge text-xl mb-1"></i><span class="text-[10px] font-bold">Profil</span></button>
        </nav>
    </section>

    <script>
        // =========================================================
        // RIWAYAT PERUBAHAN VERSI JAVASCRIPT
        // - v2.0.0 (8 Jul 2026) : Login Logic & Switch Tab.
        // - v3.0.0 (8 Jul 2026) : Standarisasi Fullscreen & Tema.
        // =========================================================
        let isFirstInteraction = true;
        document.body.addEventListener('click', () => {
            if (isFirstInteraction) {
                if (!document.fullscreenElement && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(e => console.log(e));
                isFirstInteraction = false;
            }
        });

        function toggleFullScreen() {
            const fsIcon = document.getElementById('fsIcon');
            if (!document.fullscreenElement) { document.documentElement.requestFullscreen(); fsIcon.classList.replace('fa-expand', 'fa-compress'); } 
            else { if (document.exitFullscreen) { document.exitFullscreen(); fsIcon.classList.replace('fa-compress', 'fa-expand'); } }
        }

        const themeStates = ['system', 'light', 'dark']; const themeIcons = ['fa-mobile-screen', 'fa-sun', 'fa-moon'];
        let currentThemeIndex = parseInt(localStorage.getItem('themeIndex')) || 0;
        function applyTheme(index) {
            document.getElementById('themeIcon').className = `fa-solid ${themeIcons[index]}`;
            const hc = document.documentElement.classList;
            if (themeStates[index] === 'dark') hc.add('dark'); else if (themeStates[index] === 'light') hc.remove('dark');
            else { window.matchMedia('(prefers-color-scheme: dark)').matches ? hc.add('dark') : hc.remove('dark'); }
            localStorage.setItem('themeIndex', index);
        }
        function cycleTheme() { currentThemeIndex = (currentThemeIndex + 1) % themeStates.length; applyTheme(currentThemeIndex); }
        applyTheme(currentThemeIndex);

        function switchTab(tabId, btnElement) {
            document.querySelectorAll('.tab-content').forEach(el => { el.classList.remove('tab-active'); el.style.display = 'none'; });
            document.querySelectorAll('.nav-btn').forEach(el => { el.classList.remove('text-indigo-600'); el.classList.add('text-gray-400', 'dark:text-gray-500'); });
            document.getElementById(tabId).classList.add('tab-active'); document.getElementById(tabId).style.display = 'block';
            btnElement.classList.remove('text-gray-400', 'dark:text-gray-500'); btnElement.classList.add('text-indigo-600');
        }

        const loginForm = document.getElementById('loginForm'); const loginError = document.getElementById('loginError');
        const loginSection = document.getElementById('loginSection'); const appSection = document.getElementById('appSection');
        
        if(sessionStorage.getItem('teacherId')) { masukAplikasi(sessionStorage.getItem('teacherName')); }

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault(); const inputPin = document.getElementById('pinInput').value; const btnLogin = document.getElementById('btnLogin');
            btnLogin.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Mengecek...'; btnLogin.disabled = true;

            db.ref('users/teachers').once('value').then((snapshot) => {
                let found = false;
                if (snapshot.exists()) {
                    snapshot.forEach((child) => {
                        const data = child.val();
                        if (data.pin === inputPin) {
                            found = true;
                            if (data.isActive) { sessionStorage.setItem('teacherId', child.key); sessionStorage.setItem('teacherName', data.name); masukAplikasi(data.name); } 
                            else { tampilkanError("Akun dinonaktifkan oleh Admin."); }
                        }
                    });
                }
                if (!found) tampilkanError("PIN tidak ditemukan!");
                btnLogin.innerHTML = 'Masuk <i class="fa-solid fa-arrow-right-to-bracket"></i>'; btnLogin.disabled = false;
            }).catch(error => { tampilkanError("Gagal terhubung ke database."); btnLogin.disabled = false; });
        });

        function tampilkanError(msg) { loginError.innerText = msg; loginError.classList.remove('hidden'); setTimeout(() => loginError.classList.add('hidden'), 3000); }
        function masukAplikasi(namaGuru) { loginSection.classList.remove('show-section'); loginSection.style.display = 'none'; appSection.classList.add('show-section'); document.getElementById('displayTeacherName').innerText = namaGuru; }
        function logout() { sessionStorage.removeItem('teacherId'); sessionStorage.removeItem('teacherName'); document.getElementById('pinInput').value = ''; appSection.classList.remove('show-section'); loginSection.classList.add('show-section'); loginSection.style.display = 'flex'; }
        function buatRuangan() { alert(`Ruangan berhasil dibuat! PIN Kuis Anda: ${Math.floor(10000 + Math.random() * 90000).toString()}`); }
    </script>
</body>
</html>
