<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Siswa - Kuis Pro</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class', theme: { extend: { colors: { wa_teal: '#075e54', quiz_blue: '#2563eb' } } } }</script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>
    
    <style>
        /*
        =========================================================
        RIWAYAT PERUBAHAN VERSI CSS
        - v2.0.0 (8 Jul 2026) : Background Animasi Lobby, Hide scrollbar.
        - v3.0.0 (8 Jul 2026) : Standarisasi log.
        =========================================================
        */
        ::-webkit-scrollbar { display: none; }
        .game-section { display: none; animation: slideUp 0.3s ease-out; }
        .section-active { display: flex; flex-direction: column; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .bg-animated { background: linear-gradient(-45deg, #2563eb, #4f46e5, #0ea5e9); background-size: 400% 400%; animation: gradientBG 5s ease infinite; }
        .dark .bg-animated { background: linear-gradient(-45deg, #1e3a8a, #312e81, #0f172a); background-size: 400% 400%; animation: gradientBG 5s ease infinite; }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-200 h-screen flex flex-col overflow-hidden transition-colors duration-300">

    <header class="bg-white dark:bg-gray-800 text-gray-800 dark:text-white p-4 shadow-sm flex justify-between items-center z-20 shrink-0 border-b dark:border-gray-700">
        <div class="font-black text-lg flex items-center gap-2 text-quiz_blue dark:text-blue-400"><i class="fa-solid fa-gamepad"></i> <span id="headerTitle">Join Game</span></div>
        <div class="flex space-x-6 text-xl items-center text-gray-500 dark:text-gray-400">
            <button onclick="cycleTheme()" class="hover:text-yellow-500 transition"><i id="themeIcon" class="fa-solid fa-mobile-screen"></i></button>
            <button onclick="toggleFullScreen()" class="hover:text-quiz_blue transition"><i id="fsIcon" class="fa-solid fa-expand"></i></button>
        </div>
    </header>

    <main class="flex-1 overflow-y-auto relative bg-gray-50 dark:bg-gray-900">
        <section id="sec-join" class="game-section section-active h-full items-center justify-center p-4">
            <div class="bg-white dark:bg-gray-800 p-8 rounded-3xl shadow-xl w-full max-w-sm border-t-8 border-quiz_blue">
                <div class="text-center mb-6"><h2 class="text-3xl font-black text-gray-800 dark:text-white tracking-tight">Siap Bermain?</h2><p class="text-sm text-gray-500 mt-1">Masukkan data Anda</p></div>
                <form id="joinForm" class="space-y-5">
                    <div class="relative"><i class="fa-solid fa-hashtag absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400"></i><input type="text" id="pinInput" maxlength="5" required placeholder="PIN Kuis" class="w-full pl-10 pr-4 py-3 bg-gray-100 dark:bg-gray-700 border-none rounded-xl focus:ring-2 text-lg font-bold text-center dark:text-white"></div>
                    <div class="relative"><i class="fa-solid fa-user-astronaut absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400"></i><input type="text" id="nameInput" required placeholder="Nama" class="w-full pl-10 pr-4 py-3 bg-gray-100 dark:bg-gray-700 border-none rounded-xl dark:text-white"></div>
                    <div class="relative"><i class="fa-solid fa-school absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400"></i><input type="text" id="classInput" required placeholder="Kelas" class="w-full pl-10 pr-4 py-3 bg-gray-100 dark:bg-gray-700 border-none rounded-xl dark:text-white"></div>
                    <button type="submit" id="btnJoin" class="w-full bg-quiz_blue text-white font-black py-4 rounded-xl shadow-lg mt-2">Masuk Sekarang <i class="fa-solid fa-rocket ml-2"></i></button>
                    <p id="joinError" class="text-red-500 text-sm font-bold text-center hidden"></p>
                </form>
            </div>
        </section>

        <section id="sec-lobby" class="game-section h-full items-center justify-center p-4 bg-animated text-white">
            <div class="text-center w-full max-w-sm">
                <i class="fa-solid fa-spinner fa-spin-pulse text-6xl mb-6 opacity-80"></i>
                <h2 class="text-4xl font-black mb-2 drop-shadow-md">Anda di Dalam!</h2>
                <p class="text-lg opacity-90 font-medium mb-8">Halo <span id="displayName" class="text-yellow-300 font-black"></span>, perhatikan layar Guru.</p>
                <div class="bg-black/20 backdrop-blur-sm p-4 rounded-2xl border border-white/20">
                    <p class="text-xs uppercase tracking-widest opacity-70 mb-1 font-bold">PIN Ruangan</p>
                    <p id="displayPin" class="text-3xl font-black tracking-[0.2em] text-yellow-300"></p>
                </div>
            </div>
        </section>
    </main>

    <script>
        // =========================================================
        // RIWAYAT PERUBAHAN VERSI JAVASCRIPT
        // - v2.0.0 (8 Jul 2026) : Auto Fullscreen, Join Room Logic.
        // - v3.0.0 (8 Jul 2026) : Strukturisasi log versi.
        // =========================================================

        let isFirstInteraction = true;
        document.body.addEventListener('click', () => {
            if (isFirstInteraction) {
                if (!document.fullscreenElement && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(e => console.log(e));
                isFirstInteraction = false;
            }
        });

        function toggleFullScreen() {
            const fsIcon = document.getElementById('fsIcon');
            if (!document.fullscreenElement) { document.documentElement.requestFullscreen(); fsIcon.classList.replace('fa-expand', 'fa-compress'); } 
            else { if (document.exitFullscreen) { document.exitFullscreen(); fsIcon.classList.replace('fa-compress', 'fa-expand'); } }
        }

        const themeStates = ['system', 'light', 'dark']; const themeIcons = ['fa-mobile-screen', 'fa-sun', 'fa-moon'];
        let currentThemeIndex = parseInt(localStorage.getItem('themeIndex')) || 0;
        function applyTheme(index) {
            document.getElementById('themeIcon').className = `fa-solid ${themeIcons[index]}`;
            const hc = document.documentElement.classList;
            if (themeStates[index] === 'dark') hc.add('dark'); else if (themeStates[index] === 'light') hc.remove('dark');
            else { window.matchMedia('(prefers-color-scheme: dark)').matches ? hc.add('dark') : hc.remove('dark'); }
            localStorage.setItem('themeIndex', index);
        }
        function cycleTheme() { currentThemeIndex = (currentThemeIndex + 1) % themeStates.length; applyTheme(currentThemeIndex); }
        applyTheme(currentThemeIndex);

        function changeSection(sectionId, headerText) {
            document.querySelectorAll('.game-section').forEach(el => { el.classList.remove('section-active'); });
            document.getElementById(sectionId).classList.add('section-active'); document.getElementById('headerTitle').innerText = headerText;
        }

        const joinForm = document.getElementById('joinForm'); const joinError = document.getElementById('joinError'); const btnJoin = document.getElementById('btnJoin');
        let currentRoomPin = null; let studentSessionId = null;

        joinForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const pin = document.getElementById('pinInput').value; const name = document.getElementById('nameInput').value; const studentClass = document.getElementById('classInput').value;
            btnJoin.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Menghubungkan...'; btnJoin.disabled = true;

            db.ref('rooms/' + pin).once('value').then((snapshot) => {
                if (snapshot.exists()) {
                    if (snapshot.val().status === 'waiting') { bergabungKeLobby(pin, name, studentClass); } 
                    else { tampilkanError("Kuis sudah dimulai atau selesai."); }
                } else { tampilkanError("PIN tidak ditemukan!"); }
            }).catch(() => tampilkanError("Terjadi kesalahan jaringan."));
        });

        function bergabungKeLobby(pin, name, studentClass) {
            studentSessionId = 'student_' + Date.now(); currentRoomPin = pin;
            db.ref(`rooms/${pin}/players/${studentSessionId}`).set({ nickname: name, kelas: studentClass, score: 0, lastAnswerTime: 0 }).then(() => {
                changeSection('sec-lobby', 'Lobby Kuis'); document.getElementById('displayName').innerText = name; document.getElementById('displayPin').innerText = pin;
            }).catch(() => tampilkanError("Gagal masuk ke ruangan."));
        }

        function tampilkanError(msg) { joinError.innerText = msg; joinError.classList.remove('hidden'); btnJoin.innerHTML = 'Masuk Sekarang <i class="fa-solid fa-rocket ml-2"></i>'; btnJoin.disabled = false; }
    </script>
</body>
</html>
